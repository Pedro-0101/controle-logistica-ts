services:
  postgres:
    image: postgres:16-alpine
    container_name: controle_logistica_db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controle_logistica
    volumes:
      - pgdata:/var/lib/postgresql/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: controle_logistica_mediamtx
    restart: unless-stopped
    ports:
      - '8554:8554'
      - '8888:8888'
      - '8889:8889'
      - '9997:9997'
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  minio:
    image: elestio/minio:latest
    container_name: controle_logistica_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
