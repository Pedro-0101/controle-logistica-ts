services:
  postgres:
    image: postgres:16-alpine
    container_name: controle_logistica_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controle_logistica
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
